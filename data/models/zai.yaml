    pricing:
      input_per_m: 0.50
      output_per_m: 1.50
    scores:
      intelligence_index:
        value: 42
        benchmark_date: 2026-02-11
        source: "https://artificialanalysis.ai/leaderboards/models"
    verification:
      status: verified
    notes: "Used as Claude Opus/Sonnet/Haiku mapping target in Z.ai/Antigravity MCP setup"
