name: Build Versioned JSON

on:
  push:
    branches: [main, master]
    paths:
      - 'data/**/*.yaml'
      - 'data/**/*.yml'
      - '.github/scripts/build_json.py'

  # Also allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: Compile YAML → Versioned JSON
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the generated file back to the repo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so we can commit back

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Build JSON
        run: python .github/scripts/build_json.py

      - name: Commit and push generated JSON
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/versions/
          # Only commit if there are actual changes
          git diff --cached --quiet || git commit -m "[ci] Rebuild dashboard.json from YAML [skip ci]"
          git push
