name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'data/dashboard.json'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'svelte.config.js'
      - 'tsconfig.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify dashboard.json matches YAML source
        run: |
          pip install pyyaml
          python .github/scripts/validate_yaml.py
          python .github/scripts/build_json.py --dry-run
          python -c "
import json
from pathlib import Path
dash = json.loads(Path('data/dashboard.json').read_text())
bm = dash.get('_build_metadata', {})
assert bm.get('schema_version') == '3', 'Schema version mismatch'
print(f'  Integrity check passed — commit: {bm.get(\"commit_sha\", \"unknown\")[:12]}')
print(f'  YAML hash: {bm.get(\"yaml_integrity\", \"?\")}')
"

      - name: Build
        run: bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
